.primary{border:0;background:var(--primary);color:white;border-radius:9px;padding:13px 20px;width:100%;font-size:16px;font-weight:700;margin-top:17px;min-height:49px;cursor:pointer}

.err{color:#9b2727;font-size:13px;font-weight:600;min-height:22px;margin:8px 0 0}
.note{font-size:12px;color:#647789;border-top:1px solid var(--line);padding-top:16px;margin:17px 0 0}

const encoder=new TextEncoder();
const b64=(s)=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const form=document.getElementById('gate'),pass=document.getElementById('secret'),error=document.getElementById('error'),button=document.getElementById('unlock');
document.getElementById('toggle').addEventListener('click',e=>{const visible=pass.type==='password';pass.type=visible?'text':'password';e.currentTarget.textContent=visible?'非表示':'表示';e.currentTarget.setAttribute('aria-label',visible?'パスワードを隠す':'パスワードを表示');pass.focus();});
form.addEventListener('submit',async e=>{
 e.preventDefault();if(!pass.value)return;
 button.disabled=true;button.textContent='確認中…';error.textContent='';
 try{
  if(!window.crypto||!crypto.subtle)throw Error('secure-context');
  const password=pass.value;
  const inputKey=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:600000,hash:'SHA-256'},inputKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(nonce),additionalData:encoder.encode('ponv-dex-results-aes256-gcm-v1')},key,b64(payload));
  const doc=new TextDecoder('utf-8',{fatal:true}).decode(clear);
  document.open();document.write(doc);document.close();
 }catch(ex){error.textContent=ex?.message==='secure-context'?'HTTPSでページを開いてください。':'パスワードが一致しません。入力内容をご確認ください。';button.disabled=false;button.textContent='集計結果を表示';pass.focus();pass.select();}
});
